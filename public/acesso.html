<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Já comprei</title><link rel="stylesheet" href="style.css">
</head><body>
<div class="top wrap" style="padding-bottom:0"><a class="logo" href="index.html" style="color:inherit;text-decoration:none">LEANDRO GAROZI</a><a class="chip" href="index.html" style="text-decoration:none">← Início</a></div>
<div class="wrap" id="root">
  <div class="eyebrow">Já comprei</div>
  <h1>Acesse <em>suas fotos</em></h1>
  <p class="lead">Entre com o WhatsApp e a senha que você criou na hora da compra.</p>
  <div class="card" id="box">
    <form id="f">
      <label>Seu WhatsApp (com DDD)</label><input id="wpp" type="tel" inputmode="tel" required autocomplete="tel" placeholder="27 99999-9999">
      <label>Sua senha (4 a 6 números)</label><input id="pin" type="password" inputmode="numeric" maxlength="6" required autocomplete="current-password">
      <button class="go full" id="go">Entrar</button>
      <div class="err" id="err"></div>
    </form>
    <p class="hint-small" style="margin-top:16px">Esqueceu a senha? <a id="help" href="#" style="color:var(--moss)">Fale comigo no WhatsApp</a>.</p>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
try { const w = localStorage.getItem('wpp'); if (w) $('wpp').value = w; } catch (_) {}
fetch('/api/event').then((r) => r.json()).then((e) => { $('help').href = 'https://wa.me/' + e.whatsapp + '?text=' + encodeURIComponent('Oi! Esqueci a senha das minhas fotos do ' + e.eventName + '.'); }).catch(() => {});
$('f').addEventListener('submit', async (x) => {
  x.preventDefault(); $('err').textContent = ''; $('go').disabled = true;
  try {
    const r = await fetch('/api/acesso', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ whatsapp: $('wpp').value, pin: $('pin').value }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Erro');
    try { localStorage.setItem('wpp', $('wpp').value); } catch (_) {}
    if (d.orders.length === 1) { location.href = 'pedido.html?t=' + d.orders[0].token; return; }
    $('box').innerHTML = '<h2>Seus pedidos</h2><div style="display:grid;gap:10px;margin-top:10px">' + d.orders.map((o) =>
      `<a class="btn light" style="justify-content:space-between;width:100%;min-height:54px" href="pedido.html?t=${o.token}"><span>${esc(o.athlete || 'Fotos avulsas')} · ${o.kind === 'todas' ? 'pacote completo' : 'fotos escolhidas'}</span><span class="pill ${o.status}">${o.status}</span></a>`).join('') + '</div>';
  } catch (err) { $('err').textContent = err.message; $('go').disabled = false; }
});
</script></body></html>
