<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fotos do evento</title><link rel="stylesheet" href="style.css">
<style>
body{background:#fff}
.page{max-width:1180px;margin:0 auto;padding:0 20px}
/* capa */
.hero{position:relative;min-height:min(86vh,720px);background:var(--ink);color:#fff;overflow:hidden;display:flex;align-items:flex-end}
.slides{position:absolute;inset:0}
.slides picture{display:contents}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity 1.2s ease,transform 7s ease-out}
.slides img.on{opacity:1;transform:scale(1)}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,20,20,.92) 0,rgba(20,20,20,.5) 42%,rgba(20,20,20,.12) 100%),linear-gradient(90deg,rgba(20,20,20,.55) 0,rgba(20,20,20,0) 62%)}
.nav{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:1180px;margin:0 auto}
.nav .logo{color:#fff;font-size:20px}.nav .logo b{color:var(--lime);font-weight:400}
.nav .pill2{font:800 12px Figtree;border:1.5px solid rgba(255,255,255,.8);color:#fff;border-radius:40px;padding:9px 16px;text-decoration:none}
.hero .in{position:relative;z-index:3;padding:0 20px 38px;width:100%;max-width:1180px;margin:0 auto}
.hchip{display:inline-flex;gap:8px;align-items:center;background:var(--lime);color:var(--ink);font:800 11px Figtree;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:30px}
.hero h1{font-size:clamp(46px,9vw,84px);margin:16px 0 12px;max-width:7.2em} /* "ACHE SUAS FOTOS" numa linha e "EM SEGUNDOS" na de baixo */
.hero h1 em{background:none;color:var(--lime)}
.hero p.lead{color:#ececE6;max-width:520px;margin:0;font-size:16px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 26px;border-radius:50px;font:800 14px Figtree;letter-spacing:.02em;text-decoration:none;cursor:pointer;border:0}
.hb.p{background:var(--lime);color:var(--ink)}.hb.o{border:2px solid #fff;color:#fff;background:transparent}
.hb.d{background:var(--ink);color:#fff}
.dots{display:flex;gap:7px;margin-top:24px}.dots button{width:28px;height:4px;min-height:0;padding:0;border-radius:3px;background:rgba(255,255,255,.35)}.dots button.on{background:var(--lime)}
/* faixa */
.band{background:var(--lime);color:var(--ink);padding:13px 0;overflow:hidden}
.band div{font:400 21px Anton;text-transform:uppercase;letter-spacing:.04em;display:flex;gap:28px;justify-content:center;flex-wrap:wrap;padding:0 14px}
.band span:nth-child(even){opacity:.5}
section.s{padding:52px 0 0}
.h2s{font-size:clamp(34px,6vw,48px);margin:8px 0 8px;line-height:1}
.ey{font:800 11px Figtree;letter-spacing:.14em;text-transform:uppercase;color:#6b6f66}
.sub{color:#555;max-width:560px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.st{border:1.5px solid var(--line);border-radius:22px;padding:22px}
.st .n{font:400 54px/1 Anton;color:var(--lime);-webkit-text-stroke:1.5px var(--ink)}
.st h3{font:400 24px Anton;text-transform:uppercase;margin:8px 0 4px;letter-spacing:.02em}
.st p{font-size:14.5px;color:#555}
.galbg{background:var(--card2);margin-top:52px;padding:46px 0}
.gh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.gg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:22px}
.gg a{position:relative;display:block;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--card)}
.gg img{width:100%;height:100%;object-fit:cover;display:block}
.pcs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:26px}
.pcs .pc{flex:1 1 190px;max-width:250px}
.pc{border-radius:22px;padding:22px;background:#fff;border:1.5px solid var(--line)}
.pc .q{font:400 22px Anton;text-transform:uppercase;letter-spacing:.03em}
.pc .v{font:400 48px/1.05 Anton;margin:8px 0 4px;white-space:nowrap}
.pc small{color:#666;font-size:13px;display:block}
.pc.hot{background:var(--ink);color:#fff;border-color:var(--ink)}.pc.hot .v{color:var(--lime)}.pc.hot small{color:#cfcfca}
.bdg{display:inline-block;background:var(--lime);color:var(--ink);font:800 10px Figtree;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:20px;margin-bottom:8px}
.selfb{background:var(--ink);color:#fff;border-radius:28px;padding:36px;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;margin-top:52px}
.selfb h2{font-size:clamp(34px,6vw,48px)}.selfb h2 em{background:none;color:var(--lime)}
.selfb p{color:#d6d6d0;max-width:480px;margin-top:6px}
.cam{border-radius:24px;aspect-ratio:4/5;background:linear-gradient(170deg,#4a4d48,#222);position:relative;overflow:hidden;max-width:290px;justify-self:center;width:100%}
.cam .ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);width:56%;aspect-ratio:3/4;border:2.5px dashed var(--lime);border-radius:50%}
.priv{margin-top:16px;font-size:13px;color:#bcbcb6}
.have{background:var(--ink);color:#fff;border-radius:26px;padding:30px 32px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-top:52px}
.have .ey{color:var(--lime)}.have h2{margin:4px 0 0;color:#fff}.have .sub{color:#d0d0ca}
.have .hb{background:var(--lime);color:var(--ink)}
.cdbox{margin-top:22px;text-align:center;background:var(--card2);border-radius:24px;padding:22px 18px}
.cdbox p{font-size:15px;margin-bottom:14px}.cdbox p b{font-weight:800}
.cdrow{display:flex;gap:10px;justify-content:center}
.cdb{background:var(--ink);color:#fff;border-radius:16px;min-width:78px;padding:12px 8px 9px}
.cdb b{display:block;font:400 40px/1 Anton;color:var(--lime);letter-spacing:.02em}
.cdb span{font:700 10px Figtree;letter-spacing:.12em;text-transform:uppercase;color:#cfcfca}
.foot{background:var(--ink);color:#cfcfca;padding:34px 0;margin-top:56px;font-size:14px}
.foot .page{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}
.foot .logo{color:#fff}.foot .logo b{color:var(--lime);font-weight:400}.foot a{color:#fff}
.fsub{margin-top:6px;font-size:14px;color:#bdbdb7}
.fbtns{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.foot .hb{background:var(--lime);color:var(--ink);height:46px}
.foot .fig{text-decoration:underline;text-underline-offset:4px;font-weight:700}
.narrow{max-width:620px}
.card.hl{border:2px solid var(--ink)}
.namecard{border:2px solid var(--ink);border-radius:26px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.namecard h2{font-size:clamp(30px,5vw,44px);margin:0 0 6px}
.namecard .go{margin-top:14px}
@media(max-width:760px){
 .hero{display:block;min-height:0}
 .slides{position:relative;inset:auto;width:100%;aspect-ratio:4/5}
 .slides{overflow:hidden}
 .slides::after{content:'';position:absolute;inset:0 0 -2px;z-index:2;background:linear-gradient(0deg,#141414 0,rgba(20,20,20,.0) 34%),linear-gradient(180deg,rgba(20,20,20,.55) 0,rgba(20,20,20,0) 22%)}
 .shade{display:none}
 .hero .in{margin-top:-150px;padding-bottom:34px}
 .steps3{grid-template-columns:1fr}.gg{grid-template-columns:repeat(2,1fr)}
 .selfb,.namecard{grid-template-columns:1fr}.selfb{padding:26px 22px}.band div{font-size:16px;gap:16px}.btns .hb{flex:1;min-width:46%}
}
</style>
</head><body>
<div id="root"></div>
<script src="pin.js"></script>
<script src="rosto.js"></script>
<script src="txt.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const E = new URLSearchParams(location.search).get('e') || '';
const eq = E ? '?e=' + encodeURIComponent(E) : '', eand = E ? '&e=' + encodeURIComponent(E) : '';
const reais = (c) => 'R$ ' + (c / 100).toFixed(2).replace('.', ',').replace(',00', '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }).replace(',', ' às');
let TESTE = new URLSearchParams(location.search).has('teste'); // ?teste mostra a busca por rosto mesmo desligada (vale até fechar a aba)
if (TESTE) { try { sessionStorage.setItem('teste', '1'); } catch (_) {} } else { try { TESTE = sessionStorage.getItem('teste') === '1'; } catch (_) {} }
let ev, until, slideTimer;
function tick() {
  const el = $('count'); if (!el || !until) return;
  const ms = Date.parse(until) - Date.now();
  if (ms <= 0) { location.reload(); return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  el.textContent = `Termina em ${d ? d + 'd ' : ''}${h}h ${m}min`;
}
function tickCd() {
  document.querySelectorAll('[data-until]').forEach((el) => {
    const ms = Date.parse(el.dataset.until) - Date.now();
    if (ms <= 0) { location.reload(); return; }
    const v = { d: Math.floor(ms / 864e5), h: Math.floor(ms % 864e5 / 36e5), m: Math.floor(ms % 36e5 / 6e4), s: Math.floor(ms % 6e4 / 1e3) };
    el.querySelectorAll('[data-k]').forEach((n) => { n.textContent = String(v[n.dataset.k]).padStart(2, '0'); });
  });
}
const cdRow = () => `<div class="cdrow"><div class="cdb"><b data-k="d">00</b><span>dias</span></div><div class="cdb"><b data-k="h">00</b><span>horas</span></div><div class="cdb"><b data-k="m">00</b><span>min</span></div><div class="cdb"><b data-k="s">00</b><span>seg</span></div></div>`;
function tickSales() {
  const el = $('sc'); if (!el || !ev || !ev.salesEnd) return;
  const ms = Date.parse(ev.salesEnd) - Date.now();
  if (ms <= 0) { location.reload(); return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  el.textContent = `faltam ${d ? d + (d > 1 ? ' dias ' : ' dia ') : ''}${h}h ${m}min`;
}
const salesBox = (e) => e.salesEnd ? `<div class="cdbox" style="margin-top:28px" data-until="${esc(e.salesEnd)}"><p><b>Vendas encerram em ${fmt(e.salesEnd)}</b>. Depois dessa data não será possível comprar.</p>${cdRow()}</div>` : '';
const faceOn = (e) => e.faceEnabled || TESTE;
const logo = '<span class="logo">LEANDRO <b>GAROZI</b></span>';
const dateBR = (e) => { const d = String(e.eventDate || '').split('-'); return d.length === 3 ? d[2] + '/' + d[1] : ''; };
const options = (e) => {
  const g = {}; e.athletes.forEach((a) => (g[a.turma || 'Outros'] = g[a.turma || 'Outros'] || []).push(a));
  return Object.keys(g).map((t) => `<optgroup label="Turma ${esc(t)}">${g[t].map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</optgroup>`).join('');
};
const nameHelp = (e) => 'https://wa.me/' + e.whatsapp + '?text=' + encodeURIComponent('Oi! Não encontrei meu nome na lista de atletas do ' + e.eventName + '.');
const tierCards = (e) => (e.tiers || []).map((t) => `<div class="pc"><div class="q">${t.n} foto${t.n > 1 ? 's' : ''}</div><div class="v">${reais(t.cents)}</div><small>${t.n > 1 ? reais(Math.round(t.cents / t.n)) + ' cada' : 'Avulsa'}</small></div>`).join('');
const packCards = (L, price) => `<div class="pc hot"><span class="bdg">Pacote completo</span><div class="q">${L && L.limit ? 'Até ' + L.limit + ' fotos' : 'Todas as fotos'}</div><div class="v">${reais(price)}</div><small>${L && L.limit ? 'Foto adicional na compra do pacote: <b style="color:var(--lime)">' + reais(L.extra) + '</b> cada' : 'Do atleta, sem limite'}</small></div>`;

const steps = (items) => `<section class="s"><div class="page"><div class="ey">Passo a passo</div><h2 class="h2s">Como <em>funciona</em></h2>
  <div class="steps3">${items.map((x, i) => `<div class="st"><div class="n">${i + 1}</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div></section>`;
const footer = (e) => `<footer class="foot"><div class="page"><div>${logo}<div class="fsub">Entre em contato por aqui</div></div><div class="fbtns"><a class="hb" href="https://wa.me/${e.whatsapp}" target="_blank">WhatsApp para contato</a>${faceOn(e) ? '<a class="fig" href="termo.html' + eq + '">Termo da selfie</a>' : ''}${e.instagram ? '<a class="fig" href="https://instagram.com/' + encodeURIComponent(e.instagram) + '" target="_blank">Instagram</a>' : ''}</div></div></footer>`;
const have = () => `<div class="page"><div class="have"><div><div class="ey">Já comprou?</div><h2>Acesse suas fotos</h2><p class="sub" style="margin-top:4px">Entre com o seu WhatsApp e a senha que você criou.</p></div><a class="hb" href="acesso.html">Já comprei →</a></div></div>`;

function hero(e, title, lead, btns) {
  const imgs = [1, 2, 3, 4].map((i) => `<picture><source media="(max-width:760px)" srcset="capa/m${i}.jpg"><img src="capa/${i}.jpg" alt="" ${i > 1 ? 'loading="lazy"' : ''} class="${i === 1 ? 'on' : ''}"></picture>`).join('');
  return `<header class="hero"><div class="slides">${imgs}</div><div class="shade"></div>
    <div class="nav">${logo}<a class="pill2" href="acesso.html">Já comprei</a></div>
    <div class="in"><span class="hchip">● ${esc(e.eventName)}${dateBR(e) ? ' · ' + dateBR(e) : ''}</span>
      <h1>${tTitle(title)}</h1><p class="lead">${tLead(lead)}</p>
      <div class="btns">${btns}</div><div class="dots" id="dots"><button class="on" aria-label="Foto 1"></button><button aria-label="Foto 2"></button><button aria-label="Foto 3"></button><button aria-label="Foto 4"></button></div></div></header>`;
}
function startSlides() {
  const imgs = [...document.querySelectorAll('.slides img')], dots = [...document.querySelectorAll('#dots button')]; let i = 0;
  const go = (n) => { i = (n + imgs.length) % imgs.length; imgs.forEach((x, k) => x.classList.toggle('on', k === i)); dots.forEach((x, k) => x.classList.toggle('on', k === i)); };
  dots.forEach((d, k) => { d.onclick = () => { go(k); clearInterval(slideTimer); slideTimer = setInterval(() => go(i + 1), 5500); }; });
  clearInterval(slideTimer); slideTimer = setInterval(() => { if (!document.hidden) go(i + 1); }, 5500);
}
const openFace = (e, mode) => Rosto.open({ mode, e: E, athletes: e.athletes, onDone: (ids, a, maybe) => { try { sessionStorage.setItem('rosto:' + (E || 'principal'), JSON.stringify({ ids, maybe: maybe || [] })); } catch (_) {} location.href = 'galeria.html?' + (a ? 'a=' + a + '&' : '') + 'r=1' + eand; } });
const scrollTo = (id) => { const el = $(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

function closedView(e) {
  $('root').innerHTML = hero(e, e.texts.txt_closed_title, e.texts.txt_closed_lead, '<a class="hb p" href="acesso.html">Já comprei, acessar minhas fotos</a>') + footer(e);
  startSlides();
}

function presaleView(e) {
  $('root').innerHTML = hero(e, e.texts.txt_presale_title, e.texts.txt_presale_lead, '<a class="hb p" id="h-buy">Garantir minhas fotos</a><a class="hb o" id="h-how">Como funciona</a>') +
    `<div class="band"><div><span>Alta qualidade</span><span>///</span><span>Sem marca d'água</span><span>///</span><span>Pix ou cartão</span></div></div>
    <div class="page narrow" style="padding-bottom:10px" id="comprar">${salesBox(e)}
    <div class="card hl">
      <div class="muted" style="font-size:14px">${e.packLimit ? 'Pacote completo, até ' + e.packLimit + ' fotos do atleta' : 'Pacote completo, todas as fotos do atleta'}</div>
      <div class="price">${reais(e.allPrice)}</div>
      ${e.packLimit ? `<div class="muted" style="font-size:14px;margin-top:2px">Fotos adicionais: <b>${reais(e.packExtra)}</b> cada</div>` : ''}
      <div class="row" style="margin-top:6px"><span class="chip" id="count"></span><span class="muted" style="font-size:13px">Depois: ${reais(e.deadline.next)}</span></div>
      <form id="f" style="margin-top:22px">
        <label>De quem são as fotos</label>
        <select id="athlete" required><option value="">Escolha o nome do atleta</option>${options(e)}</select>
        <div class="hint-small" id="who" style="font-size:14px;color:var(--ink)"></div>
        <div class="hint-small">Não achou o nome? <a href="${nameHelp(e)}" target="_blank" style="font-weight:700;color:var(--ink)">Fale comigo</a>.</div>
        <label>Seu nome</label><input id="name" required autocomplete="name">
        <label>Seu WhatsApp (com DDD)</label><input id="wpp" type="tel" inputmode="tel" required autocomplete="tel" placeholder="27 99999-9999">
        <label>Seu e-mail</label><input id="email" type="email" required autocomplete="email" placeholder="seu melhor e-mail">
        <label>Crie uma senha de 4 a 6 números</label><input class="pin" id="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{4,6}" required autocomplete="new-password" placeholder="Ex.: 1234">
        <div class="hint-small">Você usa essa senha com o seu WhatsApp para baixar as fotos depois. Anote.</div>
        <button class="go full" id="go">Pagar com Pix ou cartão</button>
        <div class="err" id="err"></div>
      </form>
    </div>
    <div class="card" style="background:var(--card2);border:0">
      <h2>${esc(e.texts.txt_presale_after_title)}</h2>
      <p class="muted" style="font-size:14px;margin-bottom:4px">${tLead(e.texts.txt_presale_after_note)}</p>
      <div class="prices">${(e.tiers || []).map((t) => `<div><span>${t.n} foto${t.n > 1 ? 's' : ''}</span><b>${reais(t.cents)}</b></div>`).join('')}${e.deadline && e.deadline.next ? `<div><span>${e.packLater && e.packLater.limit ? 'Pacote completo (até ' + e.packLater.limit + ' fotos)' : 'Pacote completo (todas as fotos do atleta)'}</span><b>${reais(e.deadline.next)}</b></div>` : ''}${e.packLater && e.packLater.limit ? `<div><span>Foto adicional (acima de ${e.packLater.limit})</span><b>${reais(e.packLater.extra)}</b></div>` : ''}</div>
      <div class="box sage" style="margin-top:12px">Na pré-venda o pacote completo ${e.packLimit ? 'inclui até <b>' + e.packLimit + ' fotos</b>' : 'inclui <b>todas as fotos</b> do atleta'} e sai por <b>${reais(e.allPrice)}</b>${e.packLimit ? ' (foto adicional: ' + reais(e.packExtra) + ')' : ''}.</div>
    </div></div>` +
    '<div id="how">' + steps([['Pague', 'Pague com Pix ou cartão. Você cria uma senha de 4 a 6 números.'], ['Volte ao site', 'Quando o pagamento for confirmado, toque em Voltar ao site.'], ['Baixe', 'Depois do evento, toque em Já comprei e entre com seu WhatsApp e a senha. Suas fotos estão lá.']]) + '</div>' + have() + footer(e);
  until = e.presaleEnd; tick(); if (window.initPins) initPins(); startSlides();
  $('h-buy').onclick = () => scrollTo('comprar'); $('h-how').onclick = () => scrollTo('how');
  $('athlete').addEventListener('change', () => { const a = e.athletes.find((x) => String(x.id) === $('athlete').value); $('who').innerHTML = a ? 'Você está comprando as fotos de <b>' + esc(a.name) + '</b>.' : ''; });
  $('f').addEventListener('submit', async (x) => {
    x.preventDefault(); $('err').textContent = ''; $('go').disabled = true;
    try {
      const r = await fetch('/api/presale', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ e: E, athleteId: $('athlete').value, name: $('name').value, whatsapp: $('wpp').value, email: $('email').value, pin: $('pin').value }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Erro');
      try { localStorage.setItem('wpp', $('wpp').value); } catch (_) {}
      location.href = d.url;
    } catch (err) { $('err').textContent = err.message; $('go').disabled = false; }
  });
}

function storeView(e) {
  const dl = e.deadline, face = faceOn(e);
  const btns = face
    ? '<a class="hb p" id="h-face">◉ Buscar pelo meu rosto</a><a class="hb o" id="h-name">Escolher meu nome</a>'
    : '<a class="hb p" id="h-name">Ver minhas fotos</a><a class="hb o" href="galeria.html' + eq + '">Ver todas as fotos</a>';
  $('root').innerHTML = hero(e, e.texts.txt_hero_title || e.texts.txt_store_title, e.texts.txt_hero_lead || e.texts.txt_store_lead, btns) +
    `<div class="band"><div><span>Alta qualidade</span><span>///</span><span>Sem marca d'água</span><span>///</span><span>Download na hora</span><span>///</span><span>Pix ou cartão</span></div></div>
    <div class="page">${salesBox(e)}</div>` +
    steps([['Encontre', face ? 'Tire uma selfie ou escolha seu nome na lista. A gente mostra as suas fotos.' : 'Escolha seu nome na lista e veja as suas fotos.'], ['Escolha', 'Toque no coração das que você quer levar. O preço aparece na hora.'], ['Baixe', "Pague com Pix ou cartão e baixe tudo, sem marca d'água. O link e a senha vão para o seu e-mail."]]) +
    `<div class="galbg" id="galwrap" style="display:none"><div class="page"><div class="gh"><div><div class="ey">Prévia da galeria</div><h2 class="h2s">As fotos do <em>evento</em></h2></div><a class="hb d" href="galeria.html${eq}">Ver todas as fotos →</a></div><div class="gg" id="gg"></div></div></div>
    <section class="s"><div class="page"><div class="ey">Valores</div><h2 class="h2s">Quanto <em>custa</em></h2>
      <p class="sub">Você paga só pelas fotos que escolher. Quanto mais fotos, mais barato cada uma.</p>
      <div class="pcs">${tierCards(e)}${packCards({ limit: e.packLimit, extra: e.packExtra }, e.allPrice)}</div>
      ${dl.until ? `<div class="cdbox" data-until="${esc(dl.until)}"><p>Pacote completo por <b>${reais(e.allPrice)}</b> até ${fmt(dl.until)}. Depois, <b>${reais(dl.next)}</b>.</p>${cdRow()}</div>` : ''}</div></section>
    ${face ? `<div class="page"><div class="selfb"><div><div class="ey" style="color:var(--lime)">Busca por rosto</div><h2>Sua selfie <em>acha tudo</em></h2>
      <p>Nada de ficar rolando centenas de fotos. Tire uma selfie e a gente mostra as fotos em que você aparece, inclusive as de longe.</p>
      <div class="btns"><a class="hb p" id="selfie">◉ Tirar selfie</a><a class="hb o" id="selfie-up">+ Enviar foto</a></div>
      <div class="priv">🔒 Sua foto não é guardada e não sai do seu celular. Só números do rosto são comparados.</div></div>
      <div class="cam"><div class="ov"></div></div></div></div>` : ''}
    <section class="s" id="nome"><div class="page"><div class="namecard"><div><div class="ey">Suas fotos</div><h2>Escolha seu <em>nome</em></h2><p class="sub">Encontre seu nome na lista e veja as fotos separadas para você.</p></div>
      <div><label>Seu nome na lista</label>
      <select id="athlete"><option value="">Escolha o atleta</option>${options(e)}</select>
      <div class="hint-small">Não achou o nome? <a href="${nameHelp(e)}" target="_blank" style="font-weight:700;color:var(--ink)">Fale comigo</a>.</div>
      <button class="go full" id="see">Ver minhas fotos</button>
      <a class="btn light full" style="width:100%;margin-top:12px" href="galeria.html${eq}">Ver todas as fotos</a></div>
    </div></div></section>` + have() + footer(e);
  until = null; tickCd(); startSlides();
  $('h-name').onclick = () => scrollTo('nome');
  if (face) { $('h-face').onclick = () => openFace(e, 'cam'); $('selfie').onclick = () => openFace(e, 'cam'); $('selfie-up').onclick = () => openFace(e, 'up'); }
  $('see').onclick = () => { const a = $('athlete').value; if (a) location.href = 'galeria.html?a=' + a + eand; else $('athlete').focus(); };
  fetch('/api/photos?e=' + encodeURIComponent(E)).then((r) => r.json()).then((d) => {
    const all = d.photos || []; if (!all.length) return;
    const n = Math.min(12, all.length), step = all.length / n, pick = Array.from({ length: n }, (_, i) => all[Math.floor(i * step)]);
    $('gg').innerHTML = pick.map((id) => `<a href="galeria.html${eq}"><img src="/img/${id}" loading="lazy" alt="" draggable="false"></a>`).join(''); $('galwrap').style.display = '';
  }).catch(() => {});
}
fetch('/api/event' + eq).then((r) => r.json()).then((e) => {
  if (e.error) { $('root').innerHTML = '<div class="page"><h1 style="margin-top:60px">Evento <em>não encontrado</em></h1><p class="lead">Confira o link que você recebeu.</p></div>'; return; }
  ev = e; document.title = 'Fotos: ' + e.eventName;
  e.salesClosed ? closedView(e) : e.presale ? presaleView(e) : storeView(e);
  tickSales(); tickCd(); setInterval(() => { tick(); tickSales(); }, 30000); setInterval(tickCd, 1000);
}).catch(() => { $('root').innerHTML = '<p class="err" style="margin:60px 20px">Não consegui carregar. Recarregue a página.</p>'; });
</script></body></html>
