<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fotos do evento</title><link rel="stylesheet" href="style.css">
</head><body>
<div class="top wrap" style="padding-bottom:0"><span class="logo">LEANDRO GAROZI</span><a class="chip" href="acesso.html" style="text-decoration:none;color:var(--ink)">Já comprei</a></div>
<div class="wrap" id="root"><p class="muted" style="margin-top:40px">Carregando...</p></div>
<script src="pin.js"></script>
<script src="rosto.js"></script>
<script src="txt.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const E = new URLSearchParams(location.search).get('e') || '';
const eq = E ? '?e=' + encodeURIComponent(E) : '', eand = E ? '&e=' + encodeURIComponent(E) : '';
const reais = (c) => 'R$ ' + (c / 100).toFixed(2).replace('.', ',').replace(',00', '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }).replace(',', ' às');
let ev, until;
function tick() {
  const el = $('count'); if (!el || !until) return;
  const ms = Date.parse(until) - Date.now();
  if (ms <= 0) { location.reload(); return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  el.textContent = `Termina em ${d ? d + 'd ' : ''}${h}h ${m}min`;
}
function tickSales() {
  const el = $('sc'); if (!el || !ev || !ev.salesEnd) return;
  const ms = Date.parse(ev.salesEnd) - Date.now();
  if (ms <= 0) { location.reload(); return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  el.textContent = `faltam ${d ? d + (d > 1 ? ' dias ' : ' dia ') : ''}${h}h ${m}min`;
}
const tierRows = (e) => (e.tiers || []).map((t) => `<div><span>${t.n} foto${t.n > 1 ? 's' : ''}</span><b>${reais(t.cents)}</b></div>`).join('');
const packName = (e) => e.packLimit ? `Pacote completo, até ${e.packLimit} fotos do atleta` : 'Pacote completo, todas as fotos do atleta';
const extraRow = (L) => L && L.limit ? `<div><span>Foto adicional (acima de ${L.limit})</span><b>${reais(L.extra)}</b></div>` : '';
const packRow = (L, price) => `<div><span>${L && L.limit ? 'Pacote completo (até ' + L.limit + ' fotos)' : 'Pacote completo (todas as fotos do atleta)'}</span><b>${reais(price)}</b></div>`;
const salesBox = (e) => e.salesEnd ? `<div class="box sage" style="margin-top:22px;font-size:16px"><b>Vendas encerram em ${fmt(e.salesEnd)}</b><br><span id="sc" style="font-size:14px"></span><br><span style="font-size:13px">Depois dessa data não será possível comprar.</span></div>` : '';
function closedView(e) {
  $('root').innerHTML = `<div class="eyebrow">${esc(e.eventName)}</div><h1>${tTitle(e.texts.txt_closed_title)}</h1>
    <p class="lead">${tLead(e.texts.txt_closed_lead)}</p>
    <a class="btn go full" style="width:100%" href="acesso.html">Já comprei, acessar minhas fotos</a>`;
}
const options = (e) => {
  const g = {}; e.athletes.forEach((a) => (g[a.turma || 'Outros'] = g[a.turma || 'Outros'] || []).push(a));
  return Object.keys(g).map((t) => `<optgroup label="Turma ${esc(t)}">${g[t].map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</optgroup>`).join('');
};
const TESTE = new URLSearchParams(location.search).has('teste'); // ?teste mostra a busca por rosto mesmo desligada
const faceCard = (e) => (e.faceEnabled || TESTE) ? `<div class="card">
      <div class="row" style="gap:14px;flex-wrap:nowrap;align-items:center">
        <div style="width:56px;height:56px;border-radius:16px;background:var(--card2);display:grid;place-items:center;flex:none"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10V6a2 2 0 0 1 2-2h4M20 4h4a2 2 0 0 1 2 2v4M26 20v4a2 2 0 0 1-2 2h-4M10 26H6a2 2 0 0 1-2-2v-4"/><circle cx="15" cy="13" r="4"/><path d="M8 22c1-3 4-5 7-5s6 2 7 5"/></svg></div>
        <div><h2 style="font-size:20px;margin:0 0 2px">Buscar pelo meu rosto</h2><div class="muted" style="font-size:14px">Tire uma <b>selfie</b> ou envie uma <b>foto</b> sua e eu acho suas fotos.</div></div>
      </div>
      <button class="go full" id="selfie" style="margin-top:16px">Tirar selfie</button>
      <button class="light full" id="selfie-up" style="margin-top:10px">+ Enviar foto</button>
    </div>` : '';
const openFace = (e, mode) => Rosto.open({ mode, e: E, athletes: e.athletes, onDone: (ids, a) => { try { sessionStorage.setItem('rosto:' + (E || 'principal'), JSON.stringify(ids)); } catch (_) {} location.href = 'galeria.html?' + (a ? 'a=' + a + '&' : '') + 'r=1' + eand; } });
const nameHelp = (e) => 'https://wa.me/' + e.whatsapp + '?text=' + encodeURIComponent('Oi! Não encontrei meu nome na lista de atletas do ' + e.eventName + '.');
function presaleView(e) {
  $('root').innerHTML = `
    <div class="eyebrow">${esc(e.eventName)}</div>
    <h1>${tTitle(e.texts.txt_presale_title)}</h1>
    <p class="lead">${tLead(e.texts.txt_presale_lead)}</p>
    ${salesBox(e)}
    <div class="card">
      <div class="muted" style="font-size:14px">${packName(e)}</div>
      <div class="price">${reais(e.allPrice)}</div>
      ${e.packLimit ? `<div class="muted" style="font-size:14px;margin-top:2px">Fotos adicionais: <b>${reais(e.packExtra)}</b> cada</div>` : ''}
      <div class="row" style="margin-top:6px"><span class="chip" id="count"></span><span class="muted" style="font-size:13px">Depois: ${reais(e.deadline.next)}</span></div>
      <form id="f" style="margin-top:22px">
        <label>De quem são as fotos</label>
        <select id="athlete" required><option value="">Escolha o nome do atleta</option>${options(e)}</select>
        <div class="hint-small" id="who" style="font-size:14px;color:var(--ink)"></div>
        <div class="hint-small">Não achou o nome? <a href="${nameHelp(e)}" target="_blank" style="color:var(--moss);font-weight:700">Fale comigo</a>.</div>
        <label>Seu nome</label><input id="name" required autocomplete="name">
        <label>Seu WhatsApp (com DDD)</label><input id="wpp" type="tel" inputmode="tel" required autocomplete="tel" placeholder="27 99999-9999">
        <label>Seu e-mail</label><input id="email" type="email" required autocomplete="email" placeholder="seu melhor e-mail">
        <label>Crie uma senha de 4 a 6 números</label><input class="pin" id="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{4,6}" required autocomplete="new-password" placeholder="Ex.: 1234">
        <div class="hint-small">Você usa essa senha com o seu WhatsApp para baixar as fotos depois. Anote.</div>
        <button class="go full" id="go">Pagar com Pix ou cartão</button>
        <div class="err" id="err"></div>
      </form>
    </div>
    <div class="card" style="background:var(--card2);border:0">
      <h2>${esc(e.texts.txt_presale_after_title)}</h2>
      <p class="muted" style="font-size:14px;margin-bottom:4px">${tLead(e.texts.txt_presale_after_note)}</p>
      <div class="prices">${tierRows(e)}${e.deadline && e.deadline.next ? packRow(e.packLater, e.deadline.next) : ''}${extraRow(e.packLater)}</div>
      <div class="box sage" style="margin-top:12px">Na pré-venda o pacote completo ${e.packLimit ? 'inclui até <b>' + e.packLimit + ' fotos</b>' : 'inclui <b>todas as fotos</b> do atleta'} e sai por <b>${reais(e.allPrice)}</b>${e.packLimit ? ' (foto adicional: ' + reais(e.packExtra) + ')' : ''}.</div>
    </div>
    <div class="card" style="background:var(--card2);border:0">
      <h2>Como funciona</h2>
      <ol class="steps">
        <li>Você paga com Pix ou cartão.</li>
        <li>Quando o pagamento for confirmado, toque em <b>Voltar ao site</b>.</li>
        <li>Depois do evento, volte aqui, toque em <b>Já comprei</b> e entre com seu WhatsApp e a senha que você criou.</li>
      </ol>
    </div>`;
  until = e.presaleEnd; tick(); if (window.initPins) initPins();
  $('athlete').addEventListener('change', () => { const a = e.athletes.find((x) => String(x.id) === $('athlete').value); $('who').innerHTML = a ? 'Você está comprando as fotos de <b>' + esc(a.name) + '</b>.' : ''; });
  $('f').addEventListener('submit', async (x) => {
    x.preventDefault(); $('err').textContent = ''; $('go').disabled = true;
    try {
      const r = await fetch('/api/presale', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ e: E, athleteId: $('athlete').value, name: $('name').value, whatsapp: $('wpp').value, email: $('email').value, pin: $('pin').value }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Erro');
      try { localStorage.setItem('wpp', $('wpp').value); } catch (_) {}
      location.href = d.url;
    } catch (err) { $('err').textContent = err.message; $('go').disabled = false; }
  });
}
function storeView(e) {
  const dl = e.deadline;
  $('root').innerHTML = `
    <div class="eyebrow">${esc(e.eventName)}</div>
    <h1>${tTitle(e.texts.txt_store_title)}</h1>
    <p class="lead">${tLead(e.texts.txt_store_lead)}</p>
    ${salesBox(e)}
    ${faceCard(e)}
    <div class="card">
      <label>Seu nome na lista</label>
      <select id="athlete"><option value="">Escolha o atleta</option>${options(e)}</select>
      <div class="hint-small">Não achou o nome? <a href="${nameHelp(e)}" target="_blank" style="color:var(--moss);font-weight:700">Fale comigo</a>.</div>
      <button class="go full" id="see">Ver minhas fotos</button>
      <a class="btn light full" style="width:100%;margin-top:12px" href="galeria.html${eq}">Ver todas as fotos</a>
      <p class="hint-small" style="text-align:center;margin-top:16px">Já comprou? <a href="acesso.html" style="color:var(--moss);font-weight:700">Acesse suas fotos com WhatsApp e senha</a>.</p>
    </div>
    <div class="card" style="background:var(--card2);border:0">
      <h2>Quanto custa</h2>
      <div class="prices">
        ${tierRows(e)}
        <div><span>${e.packLimit ? 'Pacote completo (até ' + e.packLimit + ' fotos)' : 'Todas as fotos do atleta'}</span><b>${reais(e.allPrice)}</b></div>
        ${extraRow({ limit: e.packLimit, extra: e.packExtra })}
      </div>
      ${dl.until ? `<div class="box sage">Pacote completo por ${reais(e.allPrice)} até ${fmt(dl.until)}. Depois, ${reais(dl.next)}. <span id="count" class="chip" style="margin-left:6px"></span></div>` : ''}
    </div>`;
  until = dl.until; tick();
  if ($('selfie')) { $('selfie').onclick = () => openFace(e, 'cam'); $('selfie-up').onclick = () => openFace(e, 'up'); }
  $('see').onclick = () => { const a = $('athlete').value; if (a) location.href = 'galeria.html?a=' + a + eand; else $('athlete').focus(); };
}
fetch('/api/event' + eq).then((r) => r.json()).then((e) => {
  if (e.error) { $('root').innerHTML = '<h1 style="margin-top:40px">Evento <em>não encontrado</em></h1><p class="lead">Confira o link que você recebeu.</p>'; return; }
  ev = e; document.title = 'Fotos: ' + e.eventName;
  e.salesClosed ? closedView(e) : e.presale ? presaleView(e) : storeView(e);
  tickSales(); setInterval(() => { tick(); tickSales(); }, 30000);
}).catch(() => { $('root').innerHTML = '<p class="err" style="margin-top:40px">Não consegui carregar. Recarregue a página.</p>'; });
</script></body></html>
