<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Painel</title><link rel="stylesheet" href="style.css">
<style>.wrap{max-width:900px}.tabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.tabs button{background:var(--surface);color:var(--text);border:1px solid var(--border)}.tabs button.on{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
body{font-size:14px;line-height:1.45}
.wrap{max-width:1000px;padding:14px 16px 48px}
h1{font-size:clamp(24px,5vw,32px);margin-bottom:10px}
h2{font-size:19px;margin-bottom:8px}
.card{border-radius:16px;padding:16px 18px;margin-top:12px}
label{font-size:12px;margin:10px 0 4px}
input,select,textarea{padding:8px 11px;border-radius:10px;font-size:14px}
select{background-position:calc(100% - 17px) 55%,calc(100% - 11px) 55%}
button,.btn{min-height:36px;padding:0 16px;font-size:13px;gap:8px}
button.small,.btn.small{min-height:30px;padding:0 12px;font-size:12px}
.tabs{gap:6px;margin-top:12px}.tabs button{min-height:34px;padding:0 14px}
.box{padding:8px 12px;font-size:13px;border-radius:10px}
.g3{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px}.span2{grid-column:span 2}
@media(max-width:760px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.g3{grid-template-columns:1fr}}
.sec{grid-column:1/-1;margin:14px 0 0;padding:6px 10px;background:var(--paper);border-radius:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);font-weight:600}
.sec span{display:block;text-transform:none;letter-spacing:0;font-weight:400;color:var(--mute);margin-top:2px}
.full-w{grid-column:1/-1}
</style>
</head><body><div class="wrap">
<h1>Painel <em>administrativo</em></h1>
<div class="card" id="login"><label>Senha</label><input id="pw" type="password"><button class="full" id="ok">Entrar</button><div class="err" id="lerr"></div></div>
<div id="app" style="display:none">
  <div class="card" id="evbox" style="margin-top:0;padding:10px 14px"></div>
  <div class="tabs"><button data-t="orders" class="on">Pedidos</button><button data-t="config">Preços e datas</button><button data-t="photos">Fotos</button><button data-t="triage">Triagem</button><button data-t="athletes">Atletas</button><button data-t="link">Link e QR</button></div>
  <div class="card" id="orders"></div>
  <div class="card" id="config" style="display:none"></div>
  <div class="card" id="photos" style="display:none"></div>
  <div class="card" id="triage" style="display:none"></div>
  <div class="card" id="athletes" style="display:none"></div>
  <div class="card" id="link" style="display:none"></div>
</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reais = (c) => 'R$ ' + (c / 100).toFixed(2).replace('.', ',').replace(',00', '');
let tok = ''; try { tok = sessionStorage.getItem('adm') || ''; } catch (_) {}
let EVENTS = [], curEv = { id: 1, slug: 'principal', is_main: true, name: '' };
const evParam = () => (curEv.is_main ? '' : curEv.slug);
const pub = (u) => u + (u.includes('?') ? '&' : '?') + 'e=' + encodeURIComponent(curEv.slug);
const api = async (path, body) => {
  const r = await fetch('/api/admin/' + path, { method: body ? 'POST' : 'GET', headers: { authorization: 'Bearer ' + tok, 'x-event': String(curEv.id), 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { tok = ''; throw new Error('401'); }
  const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Erro'); return d;
};
async function loadEvents(selectId) {
  EVENTS = (await api('events')).events;
  let want = selectId || Number((() => { try { return sessionStorage.getItem('adm_ev'); } catch (_) { return ''; } })());
  curEv = EVENTS.find(e => e.id === want) || EVENTS.find(e => e.is_main) || EVENTS[0] || curEv;
  try { sessionStorage.setItem('adm_ev', String(curEv.id)); } catch (_) {}
  drawEvBox();
}
function drawEvBox() {
  $('evbox').innerHTML = `<div class="row" style="gap:10px;flex-wrap:wrap"><span style="font-size:13px;font-weight:600;color:var(--mute)">EVENTO</span>
    <select id="ev-sel" style="flex:1;min-width:240px;max-width:520px;font-weight:600;text-overflow:ellipsis">${EVENTS.map(e => `<option value="${e.id}" ${e.id === curEv.id ? 'selected' : ''}>${esc(e.name)}${e.is_main ? ' (principal)' : ''}${e.archived ? ' (arquivado)' : ''}</option>`).join('')}</select>
    <button class="small ghost" onclick="evEdit()">Configurar evento</button><button class="small" onclick="evNew()">+ Novo evento</button></div>
    <div class="muted" style="font-size:12px;margin-top:8px">Tudo abaixo (pedidos, preços, fotos, atletas e links) é do evento escolhido. Fotos: ${curEv.photos ?? 0} · Atletas: ${curEv.athletes ?? 0} · Pedidos pagos: ${curEv.paid ?? 0}</div>`;
  $('ev-sel').onchange = async () => { curEv = EVENTS.find(e => e.id === Number($('ev-sel').value)) || curEv; try { sessionStorage.setItem('adm_ev', String(curEv.id)); } catch (_) {} drawEvBox(); await refreshAll(); };
}
const refreshAll = () => Promise.all([lo(), lc(), la(), ll(), lp()]).then(() => { tq = { ids: [], i: 0, chips: [], sticky: false }; });
function modal(html) {
  const m = document.createElement('div'); m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px';
  m.innerHTML = `<div class="card" style="max-width:480px;width:100%;margin:0;max-height:90vh;overflow:auto">${html}</div>`;
  m.onclick = (e) => { if (e.target === m) m.remove(); }; document.body.appendChild(m); return m;
}
function evNew() {
  const m = modal(`<h2>Novo evento</h2><p class="muted" style="font-size:14px;margin-bottom:12px">Cria uma galeria nova, com atletas, fotos, pedidos, preços e textos só dela.</p>
    <label>Nome do evento</label><input id="en-name" placeholder="Ex.: CrossFit Vida Ativa">
    <label style="display:flex;gap:10px;align-items:center;color:var(--ink);margin-top:14px"><input type="checkbox" id="en-copy" checked> Copiar preços e textos do evento "${esc(curEv.name)}" (você ajusta depois)</label>
    <div class="row" style="margin-top:16px"><button id="en-go">Criar evento</button><button class="ghost" id="en-x">Cancelar</button></div><div class="err" id="en-err"></div>`);
  m.querySelector('#en-x').onclick = () => m.remove();
  m.querySelector('#en-go').onclick = async () => {
    try { const r = await api('events', { action: 'create', name: m.querySelector('#en-name').value, copyFrom: m.querySelector('#en-copy').checked ? curEv.id : undefined }); m.remove(); await loadEvents(r.id); await refreshAll(); }
    catch (e) { m.querySelector('#en-err').textContent = e.message; }
  };
  m.querySelector('#en-name').focus();
}
function evEdit() {
  const m = modal(`<h2>Configurar evento</h2>
    <label>Nome do evento</label><input id="ee-name" value="${esc(curEv.name)}">
    ${curEv.is_main ? '<p class="muted" style="font-size:13px;margin-top:12px">Este é o evento <b>principal</b>: abre no endereço do site sem nada depois.</p>' : `<label>Endereço do evento</label><input id="ee-slug" value="${esc(curEv.slug)}"><div class="hint-small">${esc(location.origin)}/?e=<b>${esc(curEv.slug)}</b></div>`}
    <div class="row" style="margin-top:16px"><button id="ee-save">Salvar</button><button class="ghost" id="ee-x">Fechar</button></div>
    <div class="row" style="margin-top:14px;gap:8px">${curEv.is_main ? '' : '<button class="small light" id="ee-main">Tornar principal</button>'}${curEv.is_main ? '' : `<button class="small light" id="ee-arch">${curEv.archived ? 'Reativar vendas' : 'Arquivar (encerra as vendas)'}</button>`}</div><div class="err" id="ee-err"></div>`);
  const done = async () => { m.remove(); await loadEvents(curEv.id); await refreshAll(); };
  const run = async (body) => { try { await api('events', { id: curEv.id, ...body }); await done(); } catch (e) { m.querySelector('#ee-err').textContent = e.message; } };
  m.querySelector('#ee-x').onclick = () => m.remove();
  m.querySelector('#ee-save').onclick = () => run({ action: 'update', name: m.querySelector('#ee-name').value, slug: m.querySelector('#ee-slug') ? m.querySelector('#ee-slug').value : undefined });
  if (m.querySelector('#ee-main')) m.querySelector('#ee-main').onclick = () => { if (confirm('Tornar este o evento principal? Ele passa a abrir no endereço do site sem nada depois.')) run({ action: 'main' }); };
  if (m.querySelector('#ee-arch')) m.querySelector('#ee-arch').onclick = () => run({ action: 'archive', archived: !curEv.archived });
}
async function enter() { $('login').style.display = 'none'; $('app').style.display = 'block'; await loadEvents(); await Promise.all([lo(), lc(), la(), ll(), lp()]); }
$('ok').onclick = async () => {
  try {
    const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error);
    tok = d.token; try { sessionStorage.setItem('adm', tok); } catch (_) {} enter();
  } catch (e) { $('lerr').textContent = e.message; }
};
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['orders', 'config', 'photos', 'triage', 'athletes', 'link'].forEach(id => $(id).style.display = id === b.dataset.t ? '' : 'none');
  if (b.dataset.t === 'triage') lt();
});
async function lo() {
  const d = await api('orders'); lastOrders = d.orders;
  const pre = d.orders.filter(o => o.presale);
  $('orders').innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Total vendido: ${reais(d.totalCents)}</h2><button class="ghost small" onclick="lo()">Atualizar</button></div>
    <p class="muted" style="font-size:13px;margin:4px 0 12px">${d.orders.filter(o => o.status !== 'aguardando').length} pago(s) · ${pre.length} na pré-venda</p>
    <div style="overflow-x:auto"><table><tr><th>Atleta</th><th>Comprador</th><th>Valor</th><th>Status</th><th></th></tr>` +
    (d.orders.map(o => `<tr><td>${o.athlete_name ? esc(o.athlete_name) : 'Fotos avulsas'}${o.kind === 'fotos' ? ' <span class="pill">' + o.n_photos + ' foto' + (o.n_photos > 1 ? 's' : '') + '</span>' : (o.n_photos > 0 ? ' <span class="pill">' + o.n_photos + ' marcada' + (o.n_photos > 1 ? 's' : '') + '</span>' : '')}${o.presale ? ' <span class="pill">pré</span>' : ''}</td>
      <td>${esc(o.buyer_name)}<br><a href="https://wa.me/${esc(o.whatsapp)}" target="_blank" class="muted">${esc(o.whatsapp)}</a><br><span class="muted" style="font-size:12px">${esc(o.email)}</span></td>
      <td>${reais(o.amount_cents)}</td><td><span class="pill ${o.status}">${o.status}${o.manual ? ' (manual)' : ''}</span></td>
      <td class="row" style="gap:6px">${o.status === 'aguardando' ? `<button class="small ghost" onclick="act('${o.id}','verificar')">Verificar</button> <button class="small" onclick="if(confirm('Liberar sem confirmação do Mercado Pago?'))act('${o.id}','liberar')">Liberar</button>` : `<a class="btn small light" target="_blank" href="https://wa.me/${o.whatsapp.length > 11 ? o.whatsapp : '55' + o.whatsapp}?text=${encodeURIComponent('Oi, ' + o.buyer_name.split(' ')[0] + '! Suas fotos estão prontas. Acesse ' + location.origin + '/ , toque em Já comprei e entre com seu WhatsApp e a senha que você criou.')}">Avisar</a>`} <a class="btn small ghost" target="_blank" href="pedido.html?t=${o.token}">Ver</a> ${o.status === 'pago' || o.status === 'liberado' ? `<button class="small light" onclick="reenviar('${o.id}')">Reenviar e-mail</button>` : ''} <button class="small ghost" onclick="novaSenha('${o.id}')">Senha</button> <button class="small ghost" onclick="trocaAtleta('${o.id}')">Atleta</button> <button class="small ghost" onclick="excluir('${o.id}','${o.status}')">Excluir</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nenhum pedido ainda.</td></tr>') + '</table></div>';
}
async function novaSenha(id) { const pin = prompt('Nova senha do comprador (4 a 6 números):'); if (!pin) return; try { const r = await api('orders', { id, action: 'senha', pin }); alert(r.emailed ? 'Senha trocada e enviada por e-mail ao comprador.' : 'Senha trocada. Avise o comprador (o e-mail não foi enviado).'); } catch (e) { alert(e.message); } }
async function excluir(id, status) {
  let force = false;
  if (status === 'pago' || status === 'liberado') {
    const t = prompt('ATENÇÃO: este pedido está PAGO. Excluir apaga o acesso do comprador às fotos.\n\nPara confirmar, digite EXCLUIR:');
    if (t !== 'EXCLUIR') return; force = true;
  } else if (!confirm('Excluir este pedido? Não dá para desfazer.')) return;
  try { await api('orders', { id, action: 'excluir', force }); lo(); } catch (e) { alert(e.message); }
}
async function trocaAtleta(id) {
  const q = prompt('Digite o nome (ou parte do nome) do atleta correto:'); if (!q) return;
  const hits = athletesCache.filter(a => norm(a.name).includes(norm(q)));
  if (hits.length !== 1) { alert(hits.length ? 'Mais de um atleta: ' + hits.map(a => a.name).join(', ') + '. Digite mais do nome.' : 'Nenhum atleta encontrado.'); return; }
  if (!confirm('Trocar o pedido para ' + hits[0].name + '?')) return;
  try { await api('orders', { id, action: 'atleta', athleteId: hits[0].id }); lo(); } catch (e) { alert(e.message); }
}
let lastOrders = [];
function reenviar(id) {
  const o = lastOrders.find(x => x.id === id); if (!o) return;
  const m = document.createElement('div'); m.id = 'rs-modal';
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px';
  m.innerHTML = `<div class="card" style="max-width:460px;width:100%;margin:0"><h2>Reenviar e-mail com senha</h2>
    <p class="muted" style="font-size:14px;margin-bottom:14px">Comprador: <b style="color:var(--ink)">${esc(o.buyer_name)}</b>. Confirme o e-mail antes de enviar. Se ele disse que não recebeu, confira se está certo ou corrija aqui.</p>
    <label>E-mail do comprador</label><input id="rs-email" type="email" value="${esc(o.email)}" autocomplete="off">
    <div class="box" style="font-size:13px">Se a senha que ele criou ainda estiver guardada, ela é reenviada. Se não, o site gera uma <b>nova senha</b> de 6 números, envia e mostra aqui para você.</div>
    <div class="row" style="margin-top:16px"><button id="rs-go">Reenviar e-mail</button><button class="ghost" id="rs-x">Fechar</button></div>
    <div id="rs-res" style="margin-top:14px;font-size:14px"></div></div>`;
  document.body.appendChild(m);
  $('rs-x').onclick = () => m.remove(); m.onclick = (e) => { if (e.target === m) m.remove(); };
  $('rs-go').onclick = async () => {
    $('rs-go').disabled = true; $('rs-res').textContent = 'Enviando...';
    try {
      const r = await api('orders', { id, action: 'reenviar', email: $('rs-email').value });
      const wpp = o.whatsapp.length > 11 ? o.whatsapp : '55' + o.whatsapp;
      const wa = 'https://wa.me/' + wpp + '?text=' + encodeURIComponent('Oi, ' + o.buyer_name.split(' ')[0] + '! Seu acesso às fotos: abra ' + location.origin + '/ , toque em Já comprei e entre com seu WhatsApp e a senha ' + r.pin + '.');
      $('rs-res').innerHTML = (r.emailed
        ? `<div class="box sage" style="margin:0">✓ E-mail enviado para <b>${esc(r.email)}</b>.</div>`
        : `<div class="box" style="margin:0;background:#fdecea;color:#7a1f14">Não consegui enviar o e-mail${r.mailConfigured ? '' : ' (envio por e-mail não configurado)'}. Passe a senha pelo WhatsApp.</div>`)
        + `<p style="margin-top:10px">${r.novaSenha ? 'Nova senha' : 'Senha'}: <b style="font-size:20px;letter-spacing:.1em">${esc(r.pin)}</b></p>
           <div class="row" style="margin-top:8px"><a class="btn small light" target="_blank" href="${wa}">Enviar também por WhatsApp</a></div>`;
      lo();
    } catch (e) { $('rs-res').innerHTML = `<span style="color:var(--err)">${esc(e.message)}</span>`; }
    $('rs-go').disabled = false;
  };
}
async function act(id, action) { try { await api('orders', { id, action }); lo(); } catch (e) { alert(e.message); } }
const FIELDS = [
  ['Evento'],
  ['event_name', 'Nome do evento', 'text'], ['event_date', 'Data do evento', 'date'], ['whatsapp', 'Seu WhatsApp (com 55)', 'text'], ['brand_text', 'Texto da marca d\'água', 'text'],
  ['Pré-venda','Vale até o fim da pré-venda. O pacote leva as fotos do atleta (todas, ou até o limite que você definir).'],
  ['presale_price_cents', 'Valor do pacote completo', 'money'], ['presale_limit', 'Até quantas fotos (0 = todas)', 'number'], ['presale_extra_cents', 'Foto adicional (cada) acima do limite', 'money'],
  ['presale_end', 'Fim da pré-venda', 'datetime'],
  ['Fotos avulsas','Quem não leva o pacote escolhe quantas fotos quer. O site cobra sempre o menor valor possível.'],
  ['price_tiers', 'Pacotes (quantidade e preço)', 'tiers'],
  ['Depois da pré-venda','Valem quando a pré-venda terminar.'],
  ['price_all_event_cents', 'Valor do pacote completo', 'money'], ['pack_limit', 'Até quantas fotos (0 = todas)', 'number'], ['pack_extra_cents', 'Foto adicional (cada) acima do limite', 'money'],
  ['late_after_days', 'Dias com esse valor', 'number'], ['price_all_late_cents', 'Valor do pacote depois desse prazo', 'money'], ['price_box_cents', 'Pacote do box', 'money'],
  ['Datas das vendas (horário de Brasília)'],
  ['published_at', 'Fotos publicadas em (conta o prazo acima)', 'datetime', true], ['sales_end', 'Encerramento das vendas', 'datetime', true], ['sales_days', 'Ou: dias de venda após publicar (0 = não usar)', 'number'],
  ['Textos do site (use *asteriscos* para destacar: verde nos títulos, negrito nos textos)'],
  ['txt_presale_title', 'Pré-venda: título', 'textline'], ['txt_presale_lead', 'Pré-venda: texto', 'textarea'],
  ['txt_presale_after_title', 'Pré-venda: título da lista "depois da pré-venda"', 'textline'], ['txt_presale_after_note', 'Pré-venda: texto da lista "depois da pré-venda"', 'textarea'],
  ['txt_store_title', 'Loja (depois da pré-venda): título', 'textline'], ['txt_store_lead', 'Loja: texto', 'textarea'],
  ['txt_gallery_title', 'Galeria geral: título', 'textline'], ['txt_gallery_title_athlete', 'Galeria de um atleta: título ({nome} = nome do atleta)', 'textline'], ['txt_gallery_lead', 'Galeria: texto', 'textarea'],
  ['txt_claim_title', 'Marcar minhas fotos: título', 'textline'], ['txt_claim_lead', 'Marcar minhas fotos: texto', 'textarea'],
  ['txt_closed_title', 'Vendas encerradas: título', 'textline'], ['txt_closed_lead', 'Vendas encerradas: texto', 'textarea'],
  ['Marcação de fotos'],
  ['claim_enabled', 'Quem comprou o pacote pode marcar fotos suas na galeria geral? (Desligado é mais seguro: o pacote só libera as fotos que você identificou)', 'toggle'],
  ['claim_max', 'Se ligado: limite de fotos que cada pessoa pode marcar (0 = sem limite)', 'number'],
];
const tierRow = (t) => `<div class="row tier" style="flex-wrap:nowrap;gap:8px;margin-bottom:8px"><input type="number" min="1" max="300" class="tn" value="${t.n}" style="width:90px"><span style="white-space:nowrap;font-size:14px">foto(s) por R$</span><input class="tp" inputmode="decimal" value="${money(t.cents)}" style="width:120px"><button type="button" class="small ghost" onclick="this.parentNode.remove()">Remover</button></div>`;
function addTier() { $('tiers').insertAdjacentHTML('beforeend', tierRow({ n: '', cents: 0 })); }
const money = (c) => (Number(c || 0) / 100).toFixed(2).replace('.', ',');
const toCents = (v) => { let t = String(v).replace(/[^\d,.]/g, ''); if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); const n = parseFloat(t); return Number.isFinite(n) ? Math.round(n * 100) : NaN; };
const toLocal = (iso) => { const t = Date.parse(iso); return t ? new Date(t - 3 * 3600e3).toISOString().slice(0, 19) : ''; };
const fromLocal = (v) => (v ? new Date(Date.parse(v.length === 16 ? v + ':00Z' : v + 'Z') + 3 * 3600e3).toISOString() : '');
let cfgCache = {};
async function lc() {
  const c = cfgCache = await api('config');
  const input = (f) => {
    const [k, , type] = f, v = c[k];
    if (type === 'money') return `<div style="position:relative"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)">R$</span><input data-k="${k}" data-t="money" inputmode="decimal" value="${money(v)}" style="padding-left:44px"></div>`;
    if (type === 'datetime') return `<div class="row" style="flex-wrap:nowrap;gap:8px"><input type="datetime-local" step="1" data-k="${k}" data-t="datetime" value="${toLocal(v)}">${f[3] ? `<button type="button" class="small ghost" onclick="const i=this.parentNode.querySelector('input');i.value=toLocal(new Date().toISOString())">Agora</button><button type="button" class="small ghost" onclick="this.parentNode.querySelector('input').value=''">Limpar</button>` : ''}</div>`;
    if (type === 'date') return `<input type="date" data-k="${k}" data-t="date" value="${esc(v)}">`;
    if (type === 'tiers') return `<div id="tiers" data-k="price_tiers" data-t="tiers">${(c.tiers || []).map(tierRow).join('')}</div><button type="button" class="small ghost" style="margin-top:4px" onclick="addTier()">+ Adicionar pacote</button>`;

let tq = { ids: [], i: 0, chips: [], sticky: false };
async function lt() {

const tqName = (id) => (athletesCache.find(a => a.id === id) || {}).name || '';
function trender() {

function tchips() { $('tq-chips').innerHTML = tq.chips.map(id => `<span class="pill pago" style="padding:6px 12px;font-size:13px">${esc(tqName(id))} <a href="#" onclick="tqDel(${id});return false" style="margin-left:6px;color:inherit">✕</a></span>`).join(''); }

const norm = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
let athletesCache = [], brandText = 'Leandro Garozi Fotografia';

    </details>

    <div id="uplog" class="muted" style="font-size:13px;margin-top:12px;white-space:pre-line"></div>

    <select id="pm-ath"><option value="">Escolha o atleta para ver as fotos</option><option value="todas">Todas as fotos</option><option value="geral">Fotos gerais (sem atleta)</option>${d.athletes.map(a => `<option value="${a.id}">${esc(a.name)} (${a.n})</option>`).join('')}</select>
    <div id="pm-bar" class="row" style="margin-top:12px"></div>

let logoImg;
async function loadLogo() {
  if (logoImg !== undefined) return logoImg;
  try { const r = await fetch('/marca.png'); if (r.ok && (r.headers.get('content-type') || '').startsWith('image/')) { logoImg = await createImageBitmap(await r.blob()); return logoImg; } } catch (_) {}
  return (logoImg = null);
}
async function makePreview(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (_) {
    try { bmp = await createImageBitmap(file); }
    catch (__) { // Safari antigo: decodifica por <img> (já respeita a rotação do arquivo)
      const url = URL.createObjectURL(file); bmp = new Image(); bmp.src = url; await bmp.decode(); URL.revokeObjectURL(url);
    }
  }
  const bw = bmp.naturalWidth || bmp.width, bh = bmp.naturalHeight || bmp.height;
  const scale = Math.min(1, 1200 / Math.max(bw, bh));
  const w = Math.round(bw * scale), h = Math.round(bh * scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(bmp, 0, 0, w, h);
  const logo = await loadLogo();
  g.save(); g.translate(w / 2, h / 2); g.rotate(-Math.PI / 7);
  const diag = Math.hypot(w, h);
  if (logo) {
    const lw = w * 0.26, lh = lw * logo.height / logo.width; g.globalAlpha = 0.4;
    for (let y = -diag, r = 0; y < diag; y += lh * 3.2, r++) for (let x = -diag + (r % 2) * lw * 0.9; x < diag; x += lw * 1.8) g.drawImage(logo, x, y, lw, lh);
  } else {
    const fs = Math.max(18, Math.round(w * 0.05)); g.font = `700 ${fs}px Figtree, Arial, sans-serif`;
    g.fillStyle = 'rgba(255,255,255,0.45)'; g.shadowColor = 'rgba(0,0,0,0.4)'; g.shadowBlur = 5; g.textBaseline = 'middle';
    const tw = g.measureText(brandText).width;
    for (let y = -diag, r = 0; y < diag; y += fs * 4, r++) for (let x = -diag + (r % 2) * tw * 0.6; x < diag; x += tw * 1.5) g.fillText(brandText, x, y);
  }
  g.restore(); bmp.close && bmp.close();
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.7));
}
let pmIds = [], pmSel = new Set();
async function pmLoad() {
  const a = $('pm-ath').value; pmSel = new Set();
  if (!a) { pmIds = []; pmRender(); return; }
  const url = pub(a === 'geral' ? '/api/photos?geral=1' : a === 'todas' ? '/api/photos' : '/api/photos?athlete=' + a);
  pmIds = (await (await fetch(url)).json()).photos; pmRender();
}
function pmRender() {
  const n = pmSel.size;
  $('pm-bar').innerHTML = pmIds.length ? `<span class="muted" style="font-size:13px">${pmIds.length} foto${pmIds.length > 1 ? 's' : ''}</span>
    <button class="small ghost" onclick="pmAll()">Selecionar todas</button><button class="small ghost" onclick="pmNone()">Limpar seleção</button>
    <button class="small" ${n ? '' : 'disabled'} onclick="pmDelete()">Excluir selecionadas (${n})</button>` : '';
  $('pm-bar').innerHTML += pmIds.length && n ? `<div class="row" style="width:100%;margin-top:8px;padding:10px;background:var(--card2);border-radius:14px">
    <span style="font-size:13px">Atribuir as ${n} selecionada${n > 1 ? 's' : ''} a:</span>
    <select id="pm-to" style="flex:1;min-width:160px"><option value="">Escolha o atleta</option>${athletesCache.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
    <button class="small" onclick="pmAssign('assign')">Atribuir</button>
    ${/^\d+$/.test($('pm-ath').value) ? `<button class="small ghost" onclick="pmAssign('unassign')">Tirar deste atleta</button>` : ''}
    <button class="small ghost" onclick="pmAssign('clear')">Deixar sem atleta</button></div>` : '';
  $('pm-grid').innerHTML = pmIds.length ? pmIds.map(id => { const on = pmSel.has(id); return `<div onclick="pmToggle('${id}')" style="position:relative;cursor:pointer">
      <img src="/img/${id}" loading="lazy" alt="" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block;outline:${on ? '3px solid var(--moss)' : '0'};outline-offset:-3px">
      <span style="position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:${on ? 'var(--moss)' : 'rgba(255,255,255,.92)'};color:#fff;display:grid;place-items:center;font-size:14px">${on ? '✓' : ''}</span></div>`; }).join('')
    : ($('pm-ath').value ? '<p class="muted" style="grid-column:1/-1">Nenhuma foto aqui.</p>' : '');
}
function pmToggle(id) { pmSel.has(id) ? pmSel.delete(id) : pmSel.add(id); pmRender(); }
function pmAll() { pmSel = new Set(pmIds); pmRender(); }
function pmNone() { pmSel = new Set(); pmRender(); }
async function pmAssign(action) {
  const ids = [...pmSel]; if (!ids.length) return;
  const body = { action, ids };
  if (action === 'assign') { const a = $('pm-to') && $('pm-to').value; if (!a) { alert('Escolha o atleta.'); return; } body.athleteId = Number(a); }
  if (action === 'unassign') body.athleteId = Number($('pm-ath').value);
  const nome = body.athleteId ? (athletesCache.find(a => a.id === body.athleteId) || {}).name : '';
  const msg = action === 'assign' ? `Atribuir ${ids.length} foto(s) a ${nome}? Quem comprou o pacote completo dele passa a ver essas fotos.` : action === 'unassign' ? `Tirar ${ids.length} foto(s) de ${nome}?` : `Deixar ${ids.length} foto(s) sem atleta?`;
  if (!confirm(msg)) return;
  try { for (let i = 0; i < ids.length; i += 300) await api('photos', { ...body, ids: ids.slice(i, i + 300) }); }
  catch (e) { alert('Erro: ' + e.message); return; }
  const v = $('pm-ath').value; await lp(); $('pm-ath').value = v; await pmLoad();
}
async function pmDelete() {
  const ids = [...pmSel]; if (!ids.length) return;
  if (ids.length > 10) { if (prompt(`Você vai excluir ${ids.length} fotos. Elas somem da vitrine e dos downloads de quem comprou. Não dá para desfazer.\n\nDigite EXCLUIR para confirmar:`) !== 'EXCLUIR') return; }
  else if (!confirm(`Excluir ${ids.length} foto${ids.length > 1 ? 's' : ''}? Some da vitrine e dos downloads. Não dá para desfazer.`)) return;
  try { for (let i = 0; i < ids.length; i += 100) await api('photos', { action: 'delete', ids: ids.slice(i, i + 100) }); }
  catch (e) { alert('Erro ao excluir: ' + e.message); return; }

}
const put = async (id, kind, body) => {
  const r = await fetch(`/api/admin/photo/${id}/${kind}`, { method: 'PUT', headers: { authorization: 'Bearer ' + tok, 'content-type': 'image/jpeg' }, body });
  if (!r.ok) { let t = ''; try { t = (await r.text()).slice(0, 200); } catch (_) {} throw new Error('falha ao enviar ' + kind + ' (' + r.status + '): ' + t); }
};
async function sendOne(file, athleteIds, geral) {
  const prev = await makePreview(file);
  const { id } = await api('photo', { filename: file.name, athleteIds, geral: !!geral });
  try { await put(id, 'prev', prev); await put(id, 'orig', file); }
  catch (e) { await fetch('/api/admin/photo/' + id, { method: 'DELETE', headers: { authorization: 'Bearer ' + tok } }); throw e; }
}
async function startUpload() {
  const jobs = [], skipped = [];
  [...$('files').files].forEach(f => jobs.push({ f, ids: [], geral: true }));
  [...$('folder').files].filter(f => /image\/jpeg/.test(f.type)).forEach(f => {
    const parts = (f.webkitRelativePath || '').split('/'); const folder = parts[parts.length - 2] || '';
    if (norm(folder) === 'geral') { jobs.push({ f, ids: [], geral: true }); return; }
    const ids = folder.split('+').map(n => athletesCache.find(a => norm(a.name) === norm(n))).filter(Boolean).map(a => a.id);
    ids.length ? jobs.push({ f, ids }) : skipped.push(f.webkitRelativePath + ' (pasta não bate com nenhum atleta)');
  });
  const log = $('uplog'); if (!jobs.length) { log.textContent = 'Nada para enviar.\n' + skipped.join('\n'); return; }
  $('up').disabled = true; let done = 0; const fails = [];
  const q = jobs.slice();
  const worker = async () => { while (q.length) { const j = q.shift(); log.textContent = `Enviando ${done + fails.length + 1} de ${jobs.length}: ${j.f.name}`;
    try { await sendOne(j.f, j.ids, j.geral); } catch (e) { try { await sendOne(j.f, j.ids, j.geral); } catch (e2) { fails.push(j.f.name + ' → ' + (e2 && e2.message || e2)); continue; } } done++; } };
  await Promise.all([worker(), worker()]);
  log.textContent = `Pronto: ${done} enviada(s).` + (fails.length ? `\nFalharam:\n${fails.join('\n')}` : '') + (skipped.length ? `\nIgnoradas:\n${skipped.join('\n')}` : '');
  $('up').disabled = false; lp().then(() => { $('uplog').textContent = log.textContent; });
}
