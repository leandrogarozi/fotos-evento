<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria</title><link rel="stylesheet" href="style.css">
<style>
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.ph{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--card);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph.on{outline:3px solid var(--moss);outline-offset:-3px}
.heart{position:absolute;top:10px;right:10px;width:42px;height:42px;min-height:0;padding:0;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);font-size:20px;line-height:1}
.on .heart,.heart.on{background:var(--moss);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--white);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:12px 20px calc(14px + env(safe-area-inset-bottom))}
.bar .in{max-width:1100px;margin:0 auto}
.bar .msg{font-size:13px;line-height:1.35;background:var(--sage);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar .msg.soft{background:var(--card2);padding:7px 14px}
.bar .msg button{flex-shrink:0}
.bar .hint{font-size:12px;color:var(--mute);margin:0 4px 8px}
.bar .line{display:flex;align-items:center;justify-content:space-between;gap:14px}
.bar .tot{font-family:'Playfair Display',serif;font-size:28px;letter-spacing:-.03em;line-height:1}
.sect{font:700 12px/1.2 'Figtree',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:26px 0 -8px}
.bar .tot small{display:block;font-family:'Figtree',sans-serif;font-size:12px;color:var(--mute);letter-spacing:0;margin-bottom:2px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(245,245,241,.98);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:72vh;border-radius:16px;pointer-events:none}
.lb .ctl{display:flex;gap:12px;align-items:center;margin-top:16px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;min-height:0;padding:0;border-radius:50%;background:var(--white);color:var(--ink);border:1px solid var(--line);font-size:20px}
.lb .x{position:absolute;top:14px;right:16px;width:42px;height:42px;min-height:0;padding:0;border-radius:50%;background:var(--white);color:var(--ink);border:1px solid var(--line);font-size:18px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(36,39,35,.35);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .card{width:100%;max-width:520px;margin:0;border-radius:28px 28px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:28px}}
</style></head><body>
<div class="top wrap wide" style="padding-bottom:0"><a class="logo" href="index.html" style="color:inherit;text-decoration:none">LEANDRO GAROZI</a><span class="row" style="gap:8px"><a class="chip" href="acesso.html" style="text-decoration:none;color:var(--ink)">Já comprei</a><a class="chip" href="index.html" style="text-decoration:none;color:var(--ink)">← Início</a></span></div>
<div class="wrap wide" id="root" style="padding-bottom:190px"><p class="muted" style="margin-top:40px">Carregando fotos...</p></div>

<div class="bar" id="bar" style="display:none"><div class="in">
  <div id="msg"></div>
  <div class="line"><div class="tot"><small id="cnt"></small><span id="total">R$ 0</span></div>
  <button class="go" id="fin" disabled>Finalizar</button></div>
</div></div>

<div class="lb" id="lb"><button class="x" id="lbx" aria-label="Fechar">✕</button>
  <button class="nav" id="lbp" style="left:12px" aria-label="Anterior">‹</button>
  <img id="lbi" alt=""><button class="nav" id="lbn" style="right:12px" aria-label="Próxima">›</button>
  <div class="ctl"><span class="muted" id="lbc"></span><button id="lbh" class="light">♡ Escolher</button></div>
</div>

<div class="sheet" id="sheet"><div class="card">
  <h2 id="sh-title">Quase lá</h2><p class="muted" id="sh-sub" style="font-size:14px;margin-bottom:16px"></p>
  <form id="f">
    <label>Seu nome</label><input id="name" required autocomplete="name">
    <label>Seu WhatsApp (com DDD)</label><input id="wpp" type="tel" inputmode="tel" required autocomplete="tel" placeholder="27 99999-9999">
    <label>Seu e-mail</label><input id="email" type="email" required autocomplete="email" placeholder="seu melhor e-mail">
    <label>Crie uma senha de 4 a 6 números</label><input class="pin" id="pin" type="password" inputmode="numeric" maxlength="6" required autocomplete="new-password" placeholder="Ex.: 1234">
    <div class="hint-small">Você usa essa senha com o seu WhatsApp para baixar as fotos depois. Anote.</div>
    <button class="go full" id="pay">Ir para o pagamento</button>
    <button type="button" class="ghost full" id="back" style="margin-top:10px">Voltar</button>
    <div class="err" id="err"></div>
  </form>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
const reais = (c) => 'R$ ' + (c / 100).toFixed(2).replace('.', ',').replace(',00', '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }).replace(',', ' às');
const Q = new URLSearchParams(location.search);
const A = Number(Q.get('a')) || 0;
const CLAIM = Q.get('claim') || '';
const E = Q.get('e') || '';
const eq = E ? '?e=' + encodeURIComponent(E) : '', eand = E ? '&e=' + encodeURIComponent(E) : '';
document.querySelectorAll('a[href="index.html"]').forEach((x) => { x.href = 'index.html' + eq; });
const TESTE = Q.has('teste');
const R = Q.get('r') === '1'; // veio da busca por rosto
let faceIds = [], maybeIds = []; try { const raw = R ? JSON.parse(sessionStorage.getItem('rosto:' + (E || 'principal')) || '[]') : []; faceIds = Array.isArray(raw) ? raw : (raw.ids || []); maybeIds = Array.isArray(raw) ? [] : (raw.maybe || []); } catch (_) {}
let secs = [], tagged = new Set();
const X = Q.get('x') || ''; // modo fotos adicionais: token do pacote já comprado
const KEY = (X ? 'selx:' + X : 'sel:' + A);
let claimMax = 0; // 0 = sem limite
let ev, ids = [], sel = new Set(), quote = null, idx = 0, mode = 'cart', qt;

const save = () => { if (CLAIM) return; try { localStorage.setItem(KEY, JSON.stringify([...sel])); } catch (_) {} };
const load = () => { if (CLAIM) return []; try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (_) { return []; } };

function header() {
  const ath = ev.athletes.find((a) => a.id === A);
  const first = ath ? ath.name.split(' ')[0] : '';
  const dl = ev.deadline, T = ev.texts || {};
  $('root').innerHTML = `
    <div class="eyebrow">${esc(ev.eventName)}</div>
    <h1>${X ? 'Fotos <em>adicionais</em>' : R && (faceIds.length || maybeIds.length) ? 'Fotos que <em>parecem você</em>' : tTitle(CLAIM ? T.txt_claim_title : ath ? T.txt_gallery_title_athlete : T.txt_gallery_title, { nome: first })}</h1>
    <p class="lead">${X ? `Estas são as outras fotos de <b>${esc(first)}</b>. Cada foto adicional custa <b>${reais(ev.extraUnit)}</b>.` : CLAIM ? tLead(T.txt_claim_lead) : R && (faceIds.length || maybeIds.length) ? `${faceIds.length ? `Achamos <b>${faceIds.length}</b> foto${faceIds.length === 1 ? '' : 's'} com um rosto parecido com o da sua selfie.` : 'Não achamos fotos com certeza.'}${maybeIds.length ? ` Separamos também <b>${maybeIds.length}</b> em que talvez seja você (rosto pequeno ou de longe), mais abaixo.` : ''} Toque no coração das que quiser levar. Se alguma não for sua, é só não marcar.` : (ath ? (tagged.size ? `Você aparece em <b>${tagged.size}</b> foto${tagged.size === 1 ? '' : 's'}. ` : 'Ainda não separamos fotos pelo seu nome. ') : '') + tLead(T.txt_gallery_lead)}</p>
    ${!CLAIM && ev.salesEnd ? `<div class="box sage" style="max-width:560px;font-size:15px"><b>Vendas encerram em ${fmt(ev.salesEnd)}</b>. Depois disso não será possível comprar.</div>` : ''}
        ${!CLAIM && !X && ath && dl.until ? `<div class="box sage" style="max-width:560px">Pacote completo${ev.packLimit ? ' (até ' + ev.packLimit + ' fotos, adicionais ' + reais(ev.packExtra) + ' cada)' : ''} por ${reais(ev.allPrice)} até ${fmt(dl.until)}. Depois, ${reais(dl.next)}.</div>` : ''}
    ${(ev.faceEnabled || TESTE) && !CLAIM && !X ? '<button class="light small" id="face-again" style="margin-top:14px">Buscar pelo meu rosto</button>' : ''}
    <div id="grid"></div>`;
  if ($('face-again')) $('face-again').onclick = () => Rosto.open({ e: E, athletes: ev.athletes, athleteId: A, onDone: (f, a, m) => { try { sessionStorage.setItem('rosto:' + (E || 'principal'), JSON.stringify({ ids: f, maybe: m || [] })); } catch (_) {} location.href = 'galeria.html?' + (a ? 'a=' + a + '&' : '') + 'r=1' + eand; } });
  $('grid').innerHTML = secs.map((s) => `${s.title ? `<div class="sect">${s.title} (${s.ids.length})</div>` : ''}<div class="grid">${s.ids.map((id) => `<div class="ph" data-id="${id}"><img src="/img/${id}" loading="lazy" alt="" draggable="false"><button class="heart" aria-label="Escolher foto">♡</button></div>`).join('')}</div>`).join('');
  $('grid').querySelectorAll('.ph').forEach((el) => {
    el.onclick = (e) => { if (e.target.closest('.heart')) toggle(el.dataset.id); else openLb(ids.indexOf(el.dataset.id)); };
  });
  paint();
}
function paint() {
  document.querySelectorAll('.ph').forEach((el) => {
    const on = sel.has(el.dataset.id); el.classList.toggle('on', on); el.querySelector('.heart').textContent = on ? '♥' : '♡';
  });
  if (!$('lb').classList.contains('open')) return;
  const on = sel.has(ids[idx]); $('lbh').textContent = on ? '♥ Escolhida' : '♡ Escolher';
}
function toggle(id) { sel.has(id) ? sel.delete(id) : sel.add(id); save(); paint(); requote(); }

function requote() {
  clearTimeout(qt); qt = setTimeout(async () => {
    if (CLAIM) {
      const n = sel.size, over = claimMax > 0 && n > claimMax; $('bar').style.display = ids.length ? '' : 'none';
      $('cnt').textContent = claimMax > 0 ? `${n} de ${claimMax} marcadas` : `${n} marcada${n === 1 ? '' : 's'}`; $('total').textContent = '';
      $('fin').textContent = 'Salvar minhas fotos'; $('fin').disabled = over;
      $('msg').innerHTML = over ? `<div class="msg">Você passou do limite de ${claimMax} fotos. Desmarque algumas.</div>` : '';
      return;
    }
    const n = sel.size;
    $('bar').style.display = ids.length ? '' : 'none';
    $('cnt').textContent = n ? `${n} foto${n > 1 ? 's' : ''}` : 'Nenhuma foto escolhida';
    $('fin').disabled = !n;
    if (!n) { $('total').textContent = reais(0); $('msg').innerHTML = (X ? `<div class="msg soft">Toque no coração das fotos que quer levar a mais. Cada foto adicional custa ${reais(ev.extraUnit)}.</div>` : '<div class="msg soft">Toque no coração para escolher suas fotos.</div>'); quote = null; return; }
    const r = await (await fetch(`/api/quote?n=${n}${A ? '&athlete=' + A : ''}${A && [...sel].some((id) => !tagged.has(id)) ? '&g=1' : ''}${X ? '&x=1' : ''}${eand}`)).json();
    quote = r; $('total').textContent = reais(r.total);
    let m = '';
    if (X) m = `<div class="msg soft">Foto adicional: ${reais(ev.extraUnit)} cada.</div>`;
    else if (r.pack) m = `<div class="msg soft">Pacote de até ${ev.packLimit} fotos${r.extras ? ` + ${r.extras} foto${r.extras > 1 ? 's' : ''} adiciona${r.extras > 1 ? 'is' : 'l'} a ${reais(ev.packExtra)}` : ''}.</div>`;
    else if (r.kind === 'all') m = `<div class="msg">Você leva todas as fotos${A ? ' do atleta' : ''}, inclusive as que não escolheu.</div>`;
    else if (r.freeExtra > 0 && !r.upsell) m = `<div class="msg soft">Você ainda pode escolher mais ${r.freeExtra} foto${r.freeExtra > 1 ? 's' : ''} sem pagar a mais.</div>`;
    if (r.upsell && r.kind !== 'all') m = `<div class="msg"><span>Você aparece em ${tagged.size} fotos. Por mais ${reais(r.upsell.extra)} leva todas.</span><button class="small" id="all">Quero todas</button></div>` + (r.freeExtra > 0 ? `<div class="hint">Você ainda pode escolher mais ${r.freeExtra} foto${r.freeExtra > 1 ? 's' : ''} sem pagar a mais.</div>` : '');
    $('msg').innerHTML = m;
    const b = $('all'); if (b) b.onclick = () => openSheet('all');
  }, 120);
}

function openLb(i) { if (i < 0) return; idx = i; $('lb').classList.add('open'); showLb(); }
function showLb() {
  $('lbi').src = '/img/' + ids[idx]; $('lbc').textContent = `${idx + 1} / ${ids.length}`; paint();
}
const nav = (d) => { idx = (idx + d + ids.length) % ids.length; showLb(); };
$('lbn').onclick = () => nav(1); $('lbp').onclick = () => nav(-1);
$('lbx').onclick = () => $('lb').classList.remove('open');
$('lbh').onclick = () => toggle(ids[idx]);
document.addEventListener('keydown', (e) => {
  if (!$('lb').classList.contains('open')) return;
  if (e.key === 'ArrowRight') nav(1); else if (e.key === 'ArrowLeft') nav(-1); else if (e.key === 'Escape') $('lb').classList.remove('open');
});
let sx = 0;
$('lb').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
$('lb').addEventListener('touchend', (e) => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) nav(dx < 0 ? 1 : -1); });
document.addEventListener('contextmenu', (e) => { if (e.target.closest('.ph, .lb')) e.preventDefault(); });
document.addEventListener('dragstart', (e) => { if (e.target.tagName === 'IMG') e.preventDefault(); });

function openSheet(m) {
  mode = m;
  if (m === 'all') { $('sh-title').textContent = 'Pacote completo'; $('sh-sub').textContent = `Todas as fotos do atleta por ${reais(ev.allPrice)}.`; }
  else if (sel.size > 300) { alert('Escolha até 300 fotos por pedido.'); return; }
  else { $('sh-title').textContent = 'Quase lá'; $('sh-sub').textContent = quote ? (quote.kind === 'all' ? `Pacote completo: ${reais(quote.total)}.` : `${sel.size} foto${sel.size > 1 ? 's' : ''}: ${reais(quote.total)}.`) : ''; }
  $('err').textContent = ''; $('sheet').classList.add('open');
}
$('fin').onclick = async () => {
  if (X) {
    $('fin').disabled = true;
    try {
      const r = await fetch('/api/checkout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ e: E, x: X, photoIds: [...sel] }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Erro');
      location.href = d.url;
    } catch (e) { alert(e.message); $('fin').disabled = false; }
    return;
  }
  if (!CLAIM) return openSheet('cart');
  $('fin').disabled = true;
  try {
    const r = await fetch('/api/claim', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: CLAIM, photoIds: [...sel] }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Erro');
    location.href = 'pedido.html?t=' + encodeURIComponent(CLAIM);
  } catch (e) { alert(e.message); $('fin').disabled = false; }
};
$('back').onclick = () => $('sheet').classList.remove('open');
$('f').addEventListener('submit', async (x) => {
  x.preventDefault(); $('err').textContent = ''; $('pay').disabled = true;
  const body = { e: E, name: $('name').value, whatsapp: $('wpp').value, email: $('email').value, pin: $('pin').value };
  if (A) body.athleteId = A;
  if (mode === 'all') body.all = true; else body.photoIds = [...sel];
  try {
    const r = await fetch('/api/checkout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Erro');
    try { localStorage.setItem('wpp', $('wpp').value); } catch (_) {}
    location.href = d.url;
  } catch (e) { $('err').textContent = e.message; $('pay').disabled = false; }
});

Promise.all([fetch('/api/event' + eq).then((r) => r.json()), fetch('/api/photos?' + (A && !CLAIM ? 'athlete=' + A + '&' : '') + 'e=' + encodeURIComponent(E)).then((r) => r.json()), A && !CLAIM ? fetch('/api/photos?e=' + encodeURIComponent(E)).then((r) => r.json()) : Promise.resolve(null), CLAIM || X ? fetch('/api/pedido/' + encodeURIComponent(CLAIM || X)).then((r) => r.json()) : Promise.resolve(null)]).then(([e, p, all, ped]) => {
  if (e.error) { $('root').innerHTML = '<h1 style="margin-top:40px">Evento <em>não encontrado</em></h1>'; return; }
  ev = e; tagged = new Set(A ? p.photos : []);
  if (A) {
    const foundOnly = faceIds.filter((id) => !tagged.has(id)), maybeOnly = maybeIds.filter((id) => !tagged.has(id) && !foundOnly.includes(id)), seen = new Set([...tagged, ...foundOnly, ...maybeOnly]);
    const general = (p.general || []).filter((id) => !seen.has(id));
    secs = [{ title: (foundOnly.length || maybeOnly.length || general.length) ? 'Suas fotos' : '', ids: p.photos }, { title: 'Encontradas pela sua selfie', ids: foundOnly }, { title: 'Talvez sejam você', ids: maybeOnly }, { title: 'Fotos gerais do evento', ids: general }].filter((s) => s.ids.length);
  } else if (R && (faceIds.length || maybeIds.length)) { const okIds = new Set(p.photos); secs = [{ title: maybeIds.length ? 'Parecem você' : '', ids: faceIds.filter((id) => okIds.has(id)) }, { title: 'Talvez sejam você', ids: maybeIds.filter((id) => okIds.has(id) && !faceIds.includes(id)) }].filter((s) => s.ids.length); }
  else secs = [{ title: '', ids: p.photos }];
  ids = secs.flatMap((s) => s.ids);
  if (X && ped) { const own = new Set((ped.photos || []).map((x) => x.id)); ids = ids.filter((id) => !own.has(id)); } claimMax = e.claimMax || 0; sel = new Set(CLAIM ? ((ped && ped.claimed) || []).filter((id) => ids.includes(id)) : load().filter((id) => ids.includes(id)));
  document.title = 'Fotos: ' + e.eventName;
  if (CLAIM && !e.claimEnabled) { $('root').innerHTML = `<div class="eyebrow">${esc(e.eventName)}</div><h1>Estamos separando <em>suas fotos</em></h1><p class="lead">As fotos são identificadas por atleta e aparecem na sua página do pedido assim que ficarem prontas.</p><a class="btn go full" style="width:100%" href="pedido.html?t=${encodeURIComponent(CLAIM)}">Voltar ao meu pedido</a>`; return; }
  if (e.salesClosed && !CLAIM) { $('root').innerHTML = `<div class="eyebrow">${esc(e.eventName)}</div><h1>${tTitle(e.texts.txt_closed_title)}</h1><p class="lead">${tLead(e.texts.txt_closed_lead)}</p><a class="btn go full" style="width:100%" href="acesso.html">Já comprei, acessar minhas fotos</a>`; return; }
  if (!ids.length && A && all && all.photos.length) {
    const ath = e.athletes.find((a) => a.id === A); const first = ath ? ath.name.split(' ')[0] : '';
    $('root').innerHTML = `<div class="eyebrow">${esc(e.eventName)}</div><h1>Fotos de <em>${esc(first)}</em></h1>
      <p class="lead">${e.claimEnabled ? 'Ainda não separamos as fotos por atleta. Você tem duas opções:' : 'As fotos deste atleta ainda estão sendo separadas. Você pode:'}</p>
      <div class="card"><h2>Pacote completo${e.packLimit ? ' (até ' + e.packLimit + ' fotos)' : ''}: ${reais(e.allPrice)}</h2><p class="muted" style="font-size:14px">${e.claimEnabled ? 'Você paga e marca no site as fotos em que aparece, sem marca d\'água.' : 'Você paga agora e as fotos aparecem na sua página assim que forem identificadas, sem marca d\'água.'}</p><button class="go full" id="buyall">Quero o pacote completo</button></div>
      <div class="card" style="background:var(--card2);border:0"><h2>Fotos avulsas</h2><p class="muted" style="font-size:14px">${(e.tiers || []).map((t) => t.n + ' foto' + (t.n > 1 ? 's' : '') + ' ' + reais(t.cents)).join(' · ')}. Veja todas as fotos e escolha as suas.</p><a class="btn light full" style="width:100%" href="galeria.html${eq}">Ver todas as fotos</a></div>`;
    $('buyall').onclick = () => openSheet('all');
    return;
  }
  if (!ids.length) { $('root').innerHTML = `<div class="eyebrow">${esc(e.eventName)}</div><h1>Em <em>breve</em></h1><p class="lead">As fotos ainda não foram publicadas. Volte em breve, elas aparecem aqui assim que estiverem prontas.</p>`; return; }
  header(); requote();
}).catch(() => { $('root').innerHTML = '<p class="err" style="margin-top:40px">Não consegui carregar. Recarregue a página.</p>'; });
</script><script src="pin.js"></script><script src="txt.js"></script><script src="rosto.js"></script></body></html>
